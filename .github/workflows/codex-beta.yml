name: Harness for Codex
run-name: ${{ inputs.publish && 'Linux release' || 'Checks' }} · ${{ github.base_ref || github.ref_name }}

on:
  push:
    branches:
      - v0.23.2-beta
  pull_request:
    branches:
      - v0.23.2-beta
  workflow_dispatch:
    inputs:
      publish:
        description: Publish this version after Linux verification passes
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  commit-status:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: conda-incubator/setup-miniconda@v4.0.1
        with:
          activate-environment: harness
          auto-activate: false
          environment-file: environment.yml
      - name: Mark the exact commit pending
        shell: bash -el {0}
        env:
          GH_TOKEN: ${{ github.token }}
        run: conda run -n harness python -B build/commit_status.py begin --publish '${{ inputs.publish == true }}'

  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out the Harness release branch
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Create the harness environment
        uses: conda-incubator/setup-miniconda@v4.0.1
        with:
          activate-environment: harness
          auto-activate: false
          environment-file: environment.yml

      - name: Compile the runtime tools
        shell: bash -el {0}
        run: conda run -n harness python -m compileall -q harness.py harness_cli build install.py .agents/skills/harness/scripts test

      - name: Dry-run project-local installation
        shell: bash -el {0}
        run: conda run -n harness python install.py --root "${RUNNER_TEMP}" --dry-run

      - name: Verify real Conda and installer with competing Python on PATH
        shell: bash -el {0}
        run: conda run --no-capture-output -n harness python -B test/integration/verify_interpreter_selection.py --output "${RUNNER_TEMP}/interpreter-selection.json"

      - name: Run unit tests
        timeout-minutes: 15
        shell: bash -el {0}
        run: conda run --no-capture-output -n harness python -u -m unittest discover -s test -v

      - name: Verify automatic Graft and Jev init with a fixture provider
        timeout-minutes: 20
        shell: bash -el {0}
        env:
          DO_NOT_TRACK: '1'
        run: conda run --no-capture-output -n harness python -B test/integration/verify_graft_retrieval.py

      - name: Cross-check blocked work and selective checkpoint resume
        shell: bash -el {0}
        run: conda run --no-capture-output -n harness python -B test/integration/verify_checkpoint_resume.py --output "${RUNNER_TEMP}/checkpoint-resume"

      - name: Verify the pinned frontmatter oracle
        shell: bash -el {0}
        run: |
          conda run -n harness python -m pip install -r test/requirements-validation.txt
          conda run -n harness python test/integration/frontmatter_differential.py --seed 20260905 --count 11000 --output "${RUNNER_TEMP}/frontmatter-report.json"

      - name: Cross-check the previous version v0.23.1-beta update to v0.23.2-beta
        shell: bash -el {0}
        run: |
          baseline_root="${RUNNER_TEMP}/harness-baselines"
          conda run -n harness python test/integration/prepare_release_baselines.py --output "${baseline_root}"
          conda run -n harness python test/integration/verify_release_upgrade.py --baseline "${baseline_root}/v0231" --output "${RUNNER_TEMP}/upgrade-v0231.json"
          conda run -n harness python test/integration/verify_cli_upgrade.py --baseline "${baseline_root}/v0231" --output "${RUNNER_TEMP}/cli-upgrade-v0231.json"
          conda run -n harness python test/integration/verify_installer_permissions.py --baseline "${baseline_root}/v0231" --candidate . --output "${RUNNER_TEMP}/installer-permissions.json"
          cat "${RUNNER_TEMP}/installer-permissions.json"

      # Runtime-plan, receipt, relay and operations unit tests run in full discovery above.

      - name: Run deterministic topology evaluations
        shell: bash -el {0}
        run: |
          conda run -n harness python .agents/skills/harness/scripts/evaluate_topology.py --plan test/fixtures/minimal-plan.json --golden test/fixtures/minimal-golden.json
          conda run -n harness python .agents/skills/harness/scripts/evaluate_topology.py --plan test/fixtures/modular-expert-pool-topology.json --golden test/fixtures/modular-expert-pool-golden.json
          conda run -n harness python .agents/skills/harness/scripts/evaluate_topology.py --plan test/fixtures/coordinated-cross-contract-topology.json --golden test/fixtures/coordinated-cross-contract-golden.json
          conda run -n harness python .agents/skills/harness/scripts/evaluate_topology.py --plan test/fixtures/coordinated-cross-contract-plan.json --golden test/fixtures/coordinated-cross-contract-golden.json

      - name: Materialize and dry-run the installed plan example
        shell: bash -el {0}
        run: |
          cp -R test/fixtures/minimal-project "${RUNNER_TEMP}/harness-minimal-project"
          conda run -n harness python .agents/skills/harness/scripts/harness_plan_builder.py --root "${RUNNER_TEMP}/harness-minimal-project" --input .agents/skills/harness/references/minimal-draft-plan.json --output "${RUNNER_TEMP}/harness-minimal-plan.json"
          conda run -n harness python .agents/skills/harness/scripts/harness_apply.py --root "${RUNNER_TEMP}/harness-minimal-project" --plan "${RUNNER_TEMP}/harness-minimal-plan.json" --dry-run
          test ! -e "${RUNNER_TEMP}/harness-minimal-project/.harness/manifest.json"
          test ! -e "${RUNNER_TEMP}/harness-minimal-project/.harness/transaction.json"

      - name: Verify evaluation CLI without live Codex calls
        shell: bash -el {0}
        run: |
          conda run -n harness python .agents/skills/harness/scripts/harness_eval.py --help
          conda run -n harness python .agents/skills/harness/scripts/harness_eval.py change-discipline-suite --cases test/fixtures/evaluation/change-discipline-cases.json --validate-only
          cp -R test/fixtures/minimal-project "${RUNNER_TEMP}/harness-eval-project"
          git -C "${RUNNER_TEMP}/harness-eval-project" init
          git -C "${RUNNER_TEMP}/harness-eval-project" config user.email "fixture@example.invalid"
          git -C "${RUNNER_TEMP}/harness-eval-project" config user.name "Harness CI"
          git -C "${RUNNER_TEMP}/harness-eval-project" add README.md pyproject.toml
          git -C "${RUNNER_TEMP}/harness-eval-project" commit -m "Create evaluation fixture"
          conda run -n harness python .agents/skills/harness/scripts/harness_plan_builder.py --root "${RUNNER_TEMP}/harness-eval-project" --input .agents/skills/harness/references/minimal-draft-plan.json --output "${RUNNER_TEMP}/harness-eval-plan.json"
          conda run -n harness python .agents/skills/harness/scripts/harness_apply.py --root "${RUNNER_TEMP}/harness-eval-project" --plan "${RUNNER_TEMP}/harness-eval-plan.json"
          conda run -n harness python .agents/skills/harness/scripts/harness_doctor.py --root "${RUNNER_TEMP}/harness-eval-project"
          # This fixture chooses an explicit exclusion policy; generation never writes it.
          printf '%s\n' '/.agents/' '/.codex/' '/.harness/' '/AGENTS.md' >> "${RUNNER_TEMP}/harness-eval-project/.git/info/exclude"
          mkdir -p "${RUNNER_TEMP}/harness-codex-home"
          conda run -n harness python .agents/skills/harness/scripts/harness_eval.py paired-run --root "${RUNNER_TEMP}/harness-eval-project" --task-file test/fixtures/evaluation/task.txt --comparison-plan test/fixtures/evaluation/comparison-plan.json --verification test/fixtures/evaluation/verification-profile.json --codex-home "${RUNNER_TEMP}/harness-codex-home" --repetitions 2 --order counterbalanced --seed 730 --dry-run --validate-materialization

      - name: Build the standalone distribution
        shell: bash -el {0}
        run: conda run -n harness python build/build_release.py --output "${RUNNER_TEMP}/harness-dist"

      - name: Verify the real Linux bootstrap and installed command
        if: runner.os == 'Linux'
        shell: bash -el {0}
        run: conda run -n harness python test/integration/verify_cli_distribution.py --archive "${RUNNER_TEMP}/harness-dist/harness-codex-0.23.2-beta-linux.tar.gz"

      - name: Verify public pipeline and cold environment setup
        if: runner.os == 'Linux'
        timeout-minutes: 25
        shell: bash -el {0}
        run: conda run --no-capture-output -n harness python -B test/integration/verify_public_install.py --dist "${RUNNER_TEMP}/harness-dist"

      - name: Verify installation from the authenticated source checkout
        if: runner.os == 'Linux'
        shell: bash -el {0}
        run: |
          bash installer/install.sh --data-dir "${RUNNER_TEMP}/source-install/data" --bin-dir "${RUNNER_TEMP}/source-install/bin" --auto-update off --no-modify-path
          "${RUNNER_TEMP}/source-install/bin/harness-codex" --version
          conda run -n harness python -B -c 'import json, os, pathlib; state=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"source-install/data/active.json").read_text()); assert state["commit"]==os.environ["GITHUB_SHA"], state; assert state["version"]=="0.23.2-beta"; print("Source installer retained the exact checked-out commit.")'

      - name: Verify the checkout remains clean
        shell: bash -el {0}
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

  native-release:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/v0.23.2-beta'
    needs: verify
    name: Official Codex compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: conda-incubator/setup-miniconda@v4.0.1
        with:
          activate-environment: harness
          auto-activate: false
          environment-file: environment.yml
      - name: Verify the official terminal and production Auto adapter without compiling Codex
        shell: bash -el {0}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conda run -n harness python -m pip install -r test/integration/requirements-auto-relay.txt
          conda run --no-capture-output -n harness python -B -u test/integration/verify_official_relay.py --output "${RUNNER_TEMP}/official-relay-evidence"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: official-relay-evidence
          retention-days: 7
          path: |
            ${{ runner.temp }}/official-relay-evidence/*.json
            ${{ runner.temp }}/official-relay-evidence/*.txt
            ${{ runner.temp }}/official-relay-evidence/*.ansi

  release:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/v0.23.2-beta'
    needs: [verify, native-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: conda-incubator/setup-miniconda@v4.0.1
        with:
          activate-environment: harness
          auto-activate: false
          environment-file: environment.yml
      - name: Build the verified release assets
        shell: bash -el {0}
        run: conda run -n harness python build/build_release.py --output "${RUNNER_TEMP}/harness-dist"
      - name: Publish the GitHub Release
        shell: bash -el {0}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v0.23.2-beta
        run: |
          test "$GITHUB_REF_NAME" = "v0.23.2-beta"
          conda run -n harness python build/release_notes.py --output "${RUNNER_TEMP}/release-body.md"
          gh release create "$RELEASE_TAG" "${RUNNER_TEMP}/harness-dist/"* --target "$GITHUB_SHA" --title "Harness for Codex v0.23.2-beta" --notes-file "${RUNNER_TEMP}/release-body.md" --prerelease

  commit-result:
    if: always() && github.event_name != 'pull_request'
    needs: [commit-status, verify, native-release, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: conda-incubator/setup-miniconda@v4.0.1
        with:
          activate-environment: harness
          auto-activate: false
          environment-file: environment.yml
      - name: Publish the actual verification or release outcome
        shell: bash -el {0}
        env:
          GH_TOKEN: ${{ github.token }}
          HARNESS_JOB_RESULTS: ${{ toJSON(needs) }}
        run: conda run -n harness python -B build/commit_status.py finish --publish '${{ inputs.publish == true }}'
