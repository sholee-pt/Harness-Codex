name: Harness for Codex v6.0 checks

on:
  push:
    branches:
      - codex/v6
  pull_request:
    branches:
      - codex/v6
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out the Harness release branch
        uses: actions/checkout@v7.0.1

      - name: Create the harness environment
        uses: conda-incubator/setup-miniconda@v4.0.1
        with:
          activate-environment: harness
          auto-activate: false
          environment-file: environment.yml

      - name: Run unit tests
        shell: bash -el {0}
        run: conda run -n harness python -m unittest discover -s tests -v

      - name: Run deterministic topology evaluations
        shell: bash -el {0}
        run: |
          conda run -n harness python .agents/skills/harness/scripts/evaluate_topology.py --plan tests/fixtures/minimal-plan.json --golden tests/fixtures/minimal-golden.json
          conda run -n harness python .agents/skills/harness/scripts/evaluate_topology.py --plan tests/fixtures/modular-expert-pool-topology.json --golden tests/fixtures/modular-expert-pool-golden.json
          conda run -n harness python .agents/skills/harness/scripts/evaluate_topology.py --plan tests/fixtures/coordinated-cross-contract-topology.json --golden tests/fixtures/coordinated-cross-contract-golden.json
          conda run -n harness python .agents/skills/harness/scripts/evaluate_topology.py --plan tests/fixtures/coordinated-cross-contract-plan.json --golden tests/fixtures/coordinated-cross-contract-golden.json

      - name: Run no-write fixture dry-runs
        shell: bash -el {0}
        run: |
          conda run -n harness python .agents/skills/harness/scripts/harness_apply.py --root tests/fixtures/minimal-project --plan tests/fixtures/minimal-plan.json --dry-run
          conda run -n harness python .agents/skills/harness/scripts/harness_apply.py --root tests/fixtures/coordinated-cross-contract --plan tests/fixtures/coordinated-cross-contract-plan.json --dry-run
          test ! -e tests/fixtures/minimal-project/.harness/manifest.json
          test ! -e tests/fixtures/minimal-project/.harness/transaction.json
          test ! -e tests/fixtures/coordinated-cross-contract/.harness/manifest.json
          test ! -e tests/fixtures/coordinated-cross-contract/.harness/transaction.json

      - name: Verify evaluation CLI without live Codex calls
        shell: bash -el {0}
        run: |
          conda run -n harness python .agents/skills/harness/scripts/harness_eval.py --help
          conda run -n harness python .agents/skills/harness/scripts/harness_eval.py change-discipline-suite --cases tests/fixtures/evaluation/change-discipline-cases.json --validate-only
          mkdir -p "${RUNNER_TEMP}/harness-codex-home"
          conda run -n harness python .agents/skills/harness/scripts/harness_eval.py paired-run --root . --task-file tests/fixtures/evaluation/task.txt --comparison-plan tests/fixtures/evaluation/comparison-plan.json --verification tests/fixtures/evaluation/verification-profile.json --codex-home "${RUNNER_TEMP}/harness-codex-home" --repetitions 2 --order counterbalanced --seed 60 --dry-run
          git diff --exit-code
