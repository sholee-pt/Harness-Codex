name: Harness for Codex v5.2 checks

on:
  push:
    branches:
      - codex/v5.2
  pull_request:
    branches:
      - codex/v5.2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out the Harness release branch
        uses: actions/checkout@v7.0.1

      - name: Create the harness environment
        uses: conda-incubator/setup-miniconda@v4.0.1
        with:
          activate-environment: harness
          auto-activate: false
          environment-file: environment.yml

      - name: Run unit tests
        shell: bash -el {0}
        run: conda run -n harness python -m unittest discover -s tests -v

      - name: Run deterministic topology evaluations
        shell: bash -el {0}
        run: |
          conda run -n harness python .agents/skills/harness/scripts/evaluate_topology.py \
            --plan tests/fixtures/minimal-plan.json \
            --golden tests/fixtures/minimal-golden.json
          conda run -n harness python .agents/skills/harness/scripts/evaluate_topology.py \
            --plan tests/fixtures/modular-expert-pool-topology.json \
            --golden tests/fixtures/modular-expert-pool-golden.json
          conda run -n harness python .agents/skills/harness/scripts/evaluate_topology.py \
            --plan tests/fixtures/coordinated-cross-contract-topology.json \
            --golden tests/fixtures/coordinated-cross-contract-golden.json
          conda run -n harness python .agents/skills/harness/scripts/evaluate_topology.py \
            --plan tests/fixtures/coordinated-cross-contract-plan.json \
            --golden tests/fixtures/coordinated-cross-contract-golden.json

      - name: Run the no-write fixture dry-runs
        shell: bash -el {0}
        run: |
          conda run -n harness python .agents/skills/harness/scripts/harness_apply.py \
            --root tests/fixtures/minimal-project \
            --plan tests/fixtures/minimal-plan.json \
            --dry-run
          conda run -n harness python .agents/skills/harness/scripts/harness_apply.py \
            --root tests/fixtures/coordinated-cross-contract \
            --plan tests/fixtures/coordinated-cross-contract-plan.json \
            --dry-run
          test ! -e tests/fixtures/minimal-project/.harness/manifest.json
          test ! -e tests/fixtures/minimal-project/.harness/transaction.json
          test ! -e tests/fixtures/coordinated-cross-contract/.harness/manifest.json
          test ! -e tests/fixtures/coordinated-cross-contract/.harness/transaction.json
          git diff --exit-code
