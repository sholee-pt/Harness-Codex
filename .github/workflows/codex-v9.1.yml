name: Harness for Codex v9.1 checks

on:
  push:
    branches:
      - codex/v9.1
  pull_request:
    branches:
      - codex/v9.1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out the Harness release branch
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Create the harness environment
        uses: conda-incubator/setup-miniconda@v4.0.1
        with:
          activate-environment: harness
          auto-activate: false
          environment-file: environment.yml

      - name: Compile the runtime tools
        shell: bash -el {0}
        run: conda run -n harness python -m compileall -q install.py .agents/skills/harness/scripts tests

      - name: Dry-run project-local installation
        shell: bash -el {0}
        run: conda run -n harness python install.py --root "${RUNNER_TEMP}" --dry-run

      - name: Run unit tests
        shell: bash -el {0}
        run: conda run -n harness python -m unittest discover -s tests -v

      - name: Verify the pinned frontmatter oracle
        shell: bash -el {0}
        run: |
          conda run -n harness python -m pip install -r tests/requirements-validation.txt
          conda run -n harness python tests/frontmatter_differential.py --seed 20260905 --count 11000 --output "${RUNNER_TEMP}/frontmatter-report.json"

      - name: Cross-check real v7.6, v8.0, v8.1, and compatible v9.0 installation updates
        shell: bash -el {0}
        run: |
          baseline_root="$(mktemp -d)"
          mkdir -p "${baseline_root}/v76" "${baseline_root}/v80" "${baseline_root}/v81" "${baseline_root}/v90"
          git archive d91f0a5ae261d44c86f4082ba5098d55b7e5cc4c | tar -x -C "${baseline_root}/v76"
          git archive ed2972555562c736496e8d90463f52efabf05305 | tar -x -C "${baseline_root}/v80"
          git archive 2a920f9555df7270d8947b9e926654746aeb9247 | tar -x -C "${baseline_root}/v81"
          git archive a1e12dadb1805e23df4c283eaa7a613e6b1b1b91 | tar -x -C "${baseline_root}/v90"
          conda run -n harness python tests/verify_release_upgrade.py --baseline "${baseline_root}/v76" --output "${RUNNER_TEMP}/upgrade-v76.json"
          conda run -n harness python tests/verify_release_upgrade.py --baseline "${baseline_root}/v80" --output "${RUNNER_TEMP}/upgrade-v80.json"
          conda run -n harness python tests/verify_release_upgrade.py --baseline "${baseline_root}/v81" --output "${RUNNER_TEMP}/upgrade-v81.json"
          conda run -n harness python tests/verify_release_upgrade.py --baseline "${baseline_root}/v90" --output "${RUNNER_TEMP}/upgrade-v90.json"
          conda run -n harness python tests/verify_installer_permissions.py --baseline "${baseline_root}/v90" --candidate . --output "${RUNNER_TEMP}/installer-permissions.json"
          cat "${RUNNER_TEMP}/installer-permissions.json"

      - name: Run runtime-plan, receipt, relay, and operations fixtures
        shell: bash -el {0}
        run: |
          conda run -n harness python -m unittest discover -s tests -p test_runtime_teamplay.py -v
          conda run -n harness python -m unittest discover -s tests -p test_runtime_receipt_v2.py -v
          conda run -n harness python -m unittest discover -s tests -p test_harness_ops.py -v

      - name: Run deterministic topology evaluations
        shell: bash -el {0}
        run: |
          conda run -n harness python .agents/skills/harness/scripts/evaluate_topology.py --plan tests/fixtures/minimal-plan.json --golden tests/fixtures/minimal-golden.json
          conda run -n harness python .agents/skills/harness/scripts/evaluate_topology.py --plan tests/fixtures/modular-expert-pool-topology.json --golden tests/fixtures/modular-expert-pool-golden.json
          conda run -n harness python .agents/skills/harness/scripts/evaluate_topology.py --plan tests/fixtures/coordinated-cross-contract-topology.json --golden tests/fixtures/coordinated-cross-contract-golden.json
          conda run -n harness python .agents/skills/harness/scripts/evaluate_topology.py --plan tests/fixtures/coordinated-cross-contract-plan.json --golden tests/fixtures/coordinated-cross-contract-golden.json

      - name: Materialize and dry-run the installed plan example
        shell: bash -el {0}
        run: |
          cp -R tests/fixtures/minimal-project "${RUNNER_TEMP}/harness-minimal-project"
          conda run -n harness python .agents/skills/harness/scripts/harness_plan_builder.py --root "${RUNNER_TEMP}/harness-minimal-project" --input .agents/skills/harness/references/minimal-draft-plan.json --output "${RUNNER_TEMP}/harness-minimal-plan.json"
          conda run -n harness python .agents/skills/harness/scripts/harness_apply.py --root "${RUNNER_TEMP}/harness-minimal-project" --plan "${RUNNER_TEMP}/harness-minimal-plan.json" --dry-run
          test ! -e "${RUNNER_TEMP}/harness-minimal-project/.harness/manifest.json"
          test ! -e "${RUNNER_TEMP}/harness-minimal-project/.harness/transaction.json"

      - name: Verify evaluation CLI without live Codex calls
        shell: bash -el {0}
        run: |
          conda run -n harness python .agents/skills/harness/scripts/harness_eval.py --help
          conda run -n harness python .agents/skills/harness/scripts/harness_eval.py change-discipline-suite --cases tests/fixtures/evaluation/change-discipline-cases.json --validate-only
          cp -R tests/fixtures/minimal-project "${RUNNER_TEMP}/harness-eval-project"
          git -C "${RUNNER_TEMP}/harness-eval-project" init
          git -C "${RUNNER_TEMP}/harness-eval-project" config user.email "fixture@example.invalid"
          git -C "${RUNNER_TEMP}/harness-eval-project" config user.name "Harness CI"
          git -C "${RUNNER_TEMP}/harness-eval-project" add README.md pyproject.toml
          git -C "${RUNNER_TEMP}/harness-eval-project" commit -m "Create evaluation fixture"
          conda run -n harness python .agents/skills/harness/scripts/harness_plan_builder.py --root "${RUNNER_TEMP}/harness-eval-project" --input .agents/skills/harness/references/minimal-draft-plan.json --output "${RUNNER_TEMP}/harness-eval-plan.json"
          conda run -n harness python .agents/skills/harness/scripts/harness_apply.py --root "${RUNNER_TEMP}/harness-eval-project" --plan "${RUNNER_TEMP}/harness-eval-plan.json"
          conda run -n harness python .agents/skills/harness/scripts/harness_doctor.py --root "${RUNNER_TEMP}/harness-eval-project"
          # This fixture chooses an explicit exclusion policy; generation never writes it.
          printf '%s\n' '/.agents/' '/.codex/' '/.harness/' '/AGENTS.md' >> "${RUNNER_TEMP}/harness-eval-project/.git/info/exclude"
          mkdir -p "${RUNNER_TEMP}/harness-codex-home"
          conda run -n harness python .agents/skills/harness/scripts/harness_eval.py paired-run --root "${RUNNER_TEMP}/harness-eval-project" --task-file tests/fixtures/evaluation/task.txt --comparison-plan tests/fixtures/evaluation/comparison-plan.json --verification tests/fixtures/evaluation/verification-profile.json --codex-home "${RUNNER_TEMP}/harness-codex-home" --repetitions 2 --order counterbalanced --seed 730 --dry-run --validate-materialization

      - name: Verify the checkout remains clean
        shell: bash -el {0}
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
