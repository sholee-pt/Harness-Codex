name: Native Codex UI candidate

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  native-ui:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            platform: linux-x86_64
    runs-on: ${{ matrix.os }}
    # Keep cold Linux builds bounded; Windows builds are paused.
    timeout-minutes: 300
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_CI_TEST_DEBUG: '0'
      CARGO_PROFILE_RELEASE_DEBUG: 0
      CARGO_PROFILE_RELEASE_LTO: 'false'
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Reserve disk space on the disposable Linux runner
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          df -h "$RUNNER_TEMP"
          # Fixed, unused hosted-image SDKs only; keep Rust, Conda and source.
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /usr/local/.ghcup /opt/ghc
          df -h "$RUNNER_TEMP"
          available_kib=$(df -Pk "$RUNNER_TEMP" | awk 'NR == 2 {print $4}')
          if [ "$available_kib" -lt 26214400 ]; then
            echo '::error::Native verification requires at least 25 GiB free before compilation.'
            exit 1
          fi
      - uses: conda-incubator/setup-miniconda@v4.0.1
        with:
          activate-environment: harness
          auto-activate: false
          environment-file: environment.yml
      - name: Prepare pinned upstream with the bounded extension
        shell: bash -el {0}
        run: |
          upstream_tag=$(conda run -n harness python -c 'import json; print(json.load(open("build/native_ui/upstream.json"))["tag"])')
          git clone --config core.longpaths=true --config core.autocrlf=false --depth 1 --branch "$upstream_tag" https://github.com/openai/codex.git "${RUNNER_TEMP}/codex-ui"
          conda run -n harness python -B build/native_ui/prepare.py --root "${RUNNER_TEMP}/codex-ui"
      - name: Install the pinned Rust toolchain
        shell: bash -el {0}
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt,clippy --target ${{ matrix.target }}
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0,nextest
      - uses: facebook/install-dotslash@1e4e7b3e07eaca387acb98f1d4720e0bee8dbb6a
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: '0.11.3'
      - name: Verify original native execution resources
        shell: bash -el {0}
        run: conda run --no-capture-output -n harness python -B build/native_ui/package.py prepare --root "${RUNNER_TEMP}/native-package" --platform ${{ matrix.platform }}
      - if: runner.os == 'Linux'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.14.0
          use-cache: false
      - name: Prepare the upstream Linux toolchain
        if: runner.os == 'Linux'
        shell: bash -el {0}
        env:
          TARGET: ${{ matrix.target }}
        run: |
          # setup-zig exports checkout-local caches even with use-cache disabled.
          # Keep compiler output outside the source identity being packaged.
          export ZIG_GLOBAL_CACHE_DIR="${RUNNER_TEMP}/harness-zig-cache/global"
          export ZIG_LOCAL_CACHE_DIR="${RUNNER_TEMP}/harness-zig-cache/local"
          echo "ZIG_GLOBAL_CACHE_DIR=${ZIG_GLOBAL_CACHE_DIR}" >> "$GITHUB_ENV"
          echo "ZIG_LOCAL_CACHE_DIR=${ZIG_LOCAL_CACHE_DIR}" >> "$GITHUB_ENV"
          bash "${RUNNER_TEMP}/codex-ui/.github/scripts/install-musl-build-tools.sh"
          echo "AWS_LC_SYS_NO_JITTER_ENTROPY=1" >> "$GITHUB_ENV"
      - name: Verify the pinned upstream V8 dependencies
        shell: bash -el {0}
        run: conda run --no-capture-output -n harness python -B build/native_ui/dependencies.py --root "${RUNNER_TEMP}/codex-ui" --target ${{ matrix.target }} --output "${RUNNER_TEMP}/harness-v8"
      - name: Verify clean Harness source before native compilation
        shell: bash -el {0}
        run: conda run --no-capture-output -n harness python -B build/native_ui/source.py
      - name: Validate release and test dependency graphs before compilation
        shell: bash -el {0}
        run: |
          conda run --no-capture-output -n harness python -B build/native_ui/lockfile.py --root "${RUNNER_TEMP}/codex-ui"
          conda run --no-capture-output -n harness python -B build/native_ui/run_tests.py --root "${RUNNER_TEMP}/codex-ui" --target ${{ matrix.target }} --metadata-only
      - name: Check the extension and preserve original UI source
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/harness-native-tests
        shell: bash -el {0}
        working-directory: ${{ runner.temp }}/codex-ui/codex-rs
        run: |
          conda run --no-capture-output -n harness just fix -p codex-tui --profile ci-test --target ${{ matrix.target }}
          conda run --no-capture-output -n harness just fmt
          conda run --no-capture-output -n harness python -B "${GITHUB_WORKSPACE}/build/native_ui/review.py" --root "${RUNNER_TEMP}/codex-ui"
          conda run --no-capture-output -n harness python -B "${GITHUB_WORKSPACE}/build/native_ui/source.py"
      - name: Check the original TUI and extension tests
        env:
          HARNESS_SELECTOR_TEST_SCRIPT: ${{ github.workspace }}/harness_cli/native_router.py
          CARGO_TARGET_DIR: ${{ runner.temp }}/harness-native-tests
        shell: bash -el {0}
        run: |
          conda run --no-capture-output -n harness python -B build/native_ui/run_tests.py --root "${RUNNER_TEMP}/codex-ui" --target ${{ matrix.target }}
          conda run --no-capture-output -n harness python -B build/native_ui/review.py --root "${RUNNER_TEMP}/codex-ui"
          conda run --no-capture-output -n harness python -B build/native_ui/source.py
      - name: Preserve test results and reclaim test build storage
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          test_root="${RUNNER_TEMP:?}/harness-native-tests"
          # Never follow a replacement link when deleting build output.
          test ! -L "$test_root"
          if [ -d "$test_root" ]; then
            if [ -f "$test_root/nextest/default/junit.xml" ]; then
              cp "$test_root/nextest/default/junit.xml" "$RUNNER_TEMP/harness-native-tests-junit.xml"
            fi
            du -sh "$test_root"
            rm -rf -- "$test_root"
          fi
          df -h "$RUNNER_TEMP"
      - uses: Swatinem/rust-cache@v2
        with:
          # Restore release output only after removing the separate test build.
          workspaces: ${{ runner.temp }}/codex-ui/codex-rs -> target
          prefix-key: harness-linux-release-v2
          cache-on-failure: true
          cache-workspace-crates: true
      - name: Check free space before the release build
        shell: bash
        run: |
          set -euo pipefail
          df -h "$RUNNER_TEMP"
          available_kib=$(df -Pk "$RUNNER_TEMP" | awk 'NR == 2 {print $4}')
          if [ "$available_kib" -lt 15728640 ]; then
            echo '::error::Native release compilation requires at least 15 GiB free after cache restoration.'
            exit 1
          fi
      - name: Build the original CLI with the Harness menu hook
        id: native-build
        shell: bash -el {0}
        working-directory: ${{ runner.temp }}/codex-ui/codex-rs
        run: cargo build --locked --target ${{ matrix.target }} --release -p codex-cli --bin codex
      - name: Assemble the verified native package
        shell: bash -el {0}
        run: |
          conda run --no-capture-output -n harness python -B build/native_ui/package.py assemble --root "${RUNNER_TEMP}/native-package" --platform ${{ matrix.platform }} --binary "${RUNNER_TEMP}/codex-ui/codex-rs/target/${{ matrix.target }}/release/codex" --output "${RUNNER_TEMP}/native-dist"
          "${RUNNER_TEMP}/native-package/bin/codex" --version
          "${RUNNER_TEMP}/native-package/bin/codex" --help
      - name: Preserve build and patch review evidence
        if: always()
        shell: bash -el {0}
        run: |
          git -C "${RUNNER_TEMP}/codex-ui" diff > "${RUNNER_TEMP}/codex-ui-patch.diff"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-ui-${{ runner.os }}
          path: |
            ${{ runner.temp }}/codex-ui/codex-rs/target/${{ matrix.target }}/release/codex
            ${{ runner.temp }}/codex-ui-patch.diff
            ${{ runner.temp }}/codex-ui/codex-rs/tui/src/chatwidget/harness_routing.rs
            ${{ runner.temp }}/codex-ui/codex-rs/tui/src/chatwidget/tests/harness_routing_tests.rs
            ${{ runner.temp }}/codex-ui/codex-rs/tui/src/chatwidget/tests/snapshots/*harness*
            ${{ runner.temp }}/codex-ui/codex-rs/tui/src/chatwidget/snapshots/*harness*
            ${{ runner.temp }}/harness-native-tests-junit.xml
            ${{ runner.temp }}/native-dist/*
          retention-days: 7
