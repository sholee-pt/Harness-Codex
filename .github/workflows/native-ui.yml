name: Native Codex UI candidate

on:
  push:
    branches: [v0.12.0-beta]
    paths: [build/native_ui/**, .github/workflows/native-ui.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-ui:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: conda-incubator/setup-miniconda@v4.0.1
        with:
          activate-environment: harness
          auto-activate: false
          environment-file: environment.yml
      - name: Prepare pinned upstream with the bounded extension
        shell: bash -el {0}
        run: |
          git -c core.longpaths=true clone --depth 1 --branch rust-v0.154.0 https://github.com/openai/codex.git "${RUNNER_TEMP}/codex-ui"
          conda run -n harness python -B build/native_ui/prepare.py --root "${RUNNER_TEMP}/codex-ui"
      - name: Install the pinned Rust toolchain
        shell: bash -el {0}
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt,clippy --target ${{ matrix.target }}
      - if: runner.os == 'Linux'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.14.0
          use-cache: false
      - name: Prepare the upstream Linux toolchain
        if: runner.os == 'Linux'
        shell: bash -el {0}
        env:
          TARGET: ${{ matrix.target }}
        run: |
          bash "${RUNNER_TEMP}/codex-ui/.github/scripts/install-musl-build-tools.sh"
          echo "AWS_LC_SYS_NO_JITTER_ENTROPY=1" >> "$GITHUB_ENV"
      - name: Verify the pinned upstream V8 dependencies
        shell: bash -el {0}
        run: conda run --no-capture-output -n harness python -B build/native_ui/dependencies.py --root "${RUNNER_TEMP}/codex-ui" --target ${{ matrix.target }} --output "${RUNNER_TEMP}/harness-v8"
      - name: Use the upstream MSVC environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP/codex-ui/.github/actions/setup-msvc-env/setup-msvc-env.ps1" -Target '${{ matrix.target }}'
          'LIBSQLITE3_FLAGS=SQLITE_DISABLE_INTRINSIC' >> $env:GITHUB_ENV
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ runner.temp }}/codex-ui/codex-rs -> target
          cache-on-failure: true
      - name: Check and build the original CLI with the Harness menu hook
        shell: bash -el {0}
        working-directory: ${{ runner.temp }}/codex-ui/codex-rs
        run: |
          conda run --no-capture-output -n harness python -B "${GITHUB_WORKSPACE}/build/native_ui/lockfile.py" --root "${RUNNER_TEMP}/codex-ui"
          cargo fmt -- --config imports_granularity=Item
          cargo build --locked --target ${{ matrix.target }} --release -p codex-cli --bin codex
      - name: Preserve build and patch review evidence
        if: always()
        shell: bash -el {0}
        run: |
          git -C "${RUNNER_TEMP}/codex-ui" diff > "${RUNNER_TEMP}/codex-ui-patch.diff"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-ui-${{ runner.os }}
          path: |
            ${{ runner.temp }}/codex-ui/codex-rs/target/${{ matrix.target }}/release/codex
            ${{ runner.temp }}/codex-ui/codex-rs/target/${{ matrix.target }}/release/codex.exe
            ${{ runner.temp }}/codex-ui-patch.diff
            ${{ runner.temp }}/codex-ui/codex-rs/tui/src/chatwidget/harness_routing.rs
          retention-days: 7
