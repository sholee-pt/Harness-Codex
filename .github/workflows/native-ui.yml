name: Native Codex UI candidate

on:
  push:
    branches: [v0.12.0-beta]
    paths: [build/native_ui/**, harness_cli/native_*.py, .github/workflows/native-ui.yml]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  native-ui:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            platform: linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_RELEASE_DEBUG: 0
      CARGO_PROFILE_RELEASE_LTO: 'false'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: conda-incubator/setup-miniconda@v4.0.1
        with:
          activate-environment: harness
          auto-activate: false
          environment-file: environment.yml
      - name: Prepare pinned upstream with the bounded extension
        shell: bash -el {0}
        run: |
          git clone --config core.longpaths=true --config core.autocrlf=false --depth 1 --branch rust-v0.154.0 https://github.com/openai/codex.git "${RUNNER_TEMP}/codex-ui"
          conda run -n harness python -B build/native_ui/prepare.py --root "${RUNNER_TEMP}/codex-ui"
      - name: Install the pinned Rust toolchain
        shell: bash -el {0}
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt,clippy --target ${{ matrix.target }}
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0,nextest
      - uses: facebook/install-dotslash@1e4e7b3e07eaca387acb98f1d4720e0bee8dbb6a
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: '0.11.3'
      - name: Verify original native execution resources
        shell: bash -el {0}
        run: conda run --no-capture-output -n harness python -B build/native_ui/package.py prepare --root "${RUNNER_TEMP}/native-package" --platform ${{ matrix.platform }}
      - if: runner.os == 'Linux'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.14.0
          use-cache: false
      - name: Prepare the upstream Linux toolchain
        if: runner.os == 'Linux'
        shell: bash -el {0}
        env:
          TARGET: ${{ matrix.target }}
        run: |
          bash "${RUNNER_TEMP}/codex-ui/.github/scripts/install-musl-build-tools.sh"
          echo "AWS_LC_SYS_NO_JITTER_ENTROPY=1" >> "$GITHUB_ENV"
      - name: Verify the pinned upstream V8 dependencies
        shell: bash -el {0}
        run: conda run --no-capture-output -n harness python -B build/native_ui/dependencies.py --root "${RUNNER_TEMP}/codex-ui" --target ${{ matrix.target }} --output "${RUNNER_TEMP}/harness-v8"
      - name: Use the upstream MSVC environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP/codex-ui/.github/actions/setup-msvc-env/setup-msvc-env.ps1" -Target '${{ matrix.target }}'
          'LIBSQLITE3_FLAGS=SQLITE_DISABLE_INTRINSIC' >> $env:GITHUB_ENV
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ runner.temp }}/codex-ui/codex-rs -> target
          cache-on-failure: true
          cache-workspace-crates: true
      - name: Verify clean Harness source before native compilation
        shell: bash -el {0}
        run: conda run --no-capture-output -n harness python -B build/native_ui/source.py
      - name: Check the extension and preserve original UI source
        shell: bash -el {0}
        working-directory: ${{ runner.temp }}/codex-ui/codex-rs
        run: |
          conda run --no-capture-output -n harness python -B "${GITHUB_WORKSPACE}/build/native_ui/lockfile.py" --root "${RUNNER_TEMP}/codex-ui"
          conda run --no-capture-output -n harness just fix -p codex-tui --release --target ${{ matrix.target }}
          conda run --no-capture-output -n harness just fmt
          conda run --no-capture-output -n harness python -B "${GITHUB_WORKSPACE}/build/native_ui/review.py" --root "${RUNNER_TEMP}/codex-ui"
          conda run --no-capture-output -n harness python -B "${GITHUB_WORKSPACE}/build/native_ui/source.py"
      - name: Build the original CLI with the Harness menu hook
        id: native-build
        shell: bash -el {0}
        working-directory: ${{ runner.temp }}/codex-ui/codex-rs
        run: cargo build --locked --target ${{ matrix.target }} --release -p codex-cli --bin codex
      - name: Assemble the verified native package
        shell: bash -el {0}
        run: |
          suffix=""
          if [[ "${{ runner.os }}" == "Windows" ]]; then suffix=".exe"; fi
          conda run --no-capture-output -n harness python -B build/native_ui/package.py assemble --root "${RUNNER_TEMP}/native-package" --platform ${{ matrix.platform }} --binary "${RUNNER_TEMP}/codex-ui/codex-rs/target/${{ matrix.target }}/release/codex${suffix}" --output "${RUNNER_TEMP}/native-dist"
          "${RUNNER_TEMP}/native-package/bin/codex${suffix}" --version
          "${RUNNER_TEMP}/native-package/bin/codex${suffix}" --help
      - name: Check the original TUI and extension tests
        if: ${{ !cancelled() && steps.native-build.outcome == 'success' }}
        env:
          HARNESS_SELECTOR_TEST_SCRIPT: ${{ github.workspace }}/harness_cli/native_router.py
        shell: bash -el {0}
        working-directory: ${{ runner.temp }}/codex-ui/codex-rs
        run: conda run --no-capture-output -n harness just test -p codex-tui --release --target ${{ matrix.target }} --locked
      - name: Preserve build and patch review evidence
        if: always()
        shell: bash -el {0}
        run: |
          git -C "${RUNNER_TEMP}/codex-ui" diff > "${RUNNER_TEMP}/codex-ui-patch.diff"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-ui-${{ runner.os }}
          path: |
            ${{ runner.temp }}/codex-ui/codex-rs/target/${{ matrix.target }}/release/codex
            ${{ runner.temp }}/codex-ui/codex-rs/target/${{ matrix.target }}/release/codex.exe
            ${{ runner.temp }}/codex-ui-patch.diff
            ${{ runner.temp }}/codex-ui/codex-rs/tui/src/chatwidget/harness_routing.rs
            ${{ runner.temp }}/codex-ui/codex-rs/tui/src/chatwidget/tests/harness_routing_tests.rs
            ${{ runner.temp }}/codex-ui/codex-rs/tui/src/chatwidget/tests/snapshots/*harness*
            ${{ runner.temp }}/codex-ui/codex-rs/tui/src/chatwidget/snapshots/*harness*
            ${{ runner.temp }}/native-dist/*
          retention-days: 7
