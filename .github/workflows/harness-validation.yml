name: Harness validation

on:
  pull_request:
  push:
    branches:
      - v2
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harness-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate plugin and skill assets
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Validate repository assets
        run: |
          python -m pip install --disable-pip-version-check --no-deps --only-binary=:all: --require-hashes -r .github/requirements-validation.txt
          python scripts/validate_repository.py
